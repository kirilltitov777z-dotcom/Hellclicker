<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0518">
  <meta name="description" content="Hellclicker — idle-кликер о пасти и аду. Герой растёт, убивая демонов.">
  <title>Hellclicker</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
  <link rel="preload" href="manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="manrope-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game">
    <header id="hud">
      <div class="hud-item"><span class="hud-emoji">💰</span><span id="gold">15</span></div>
      <div class="hud-item"><span class="hud-emoji">😈</span><span id="souls">0</span><span class="hud-label">Души</span></div>
      <div class="hud-item"><span class="hud-emoji">🗡️</span><span id="hero-level">1</span><span class="hud-label">Уровень</span></div>
    </header>

    <div id="event-banner" hidden>🎃 <b>Хэллоуин в Аду!</b> Двойной опыт и золото!</div>

    <main id="battle">
      <section id="hero-zone">
        <div id="hero">🗡️</div>
        <div class="bar hp-bar"><div id="hp-fill"></div></div>
        <div class="bar xp-bar"><div id="xp-fill"></div></div>
        <div id="hero-info"><span id="hero-dmg">Урон: 8</span> • <span id="hero-hpcur">68/68</span> HP</div>
        <div id="prestige" hidden>
          <p>Достигнут максимум уровня <b>25</b>!</p>
          <p>Восстановление души: <b id="soul-gain">0</b> (всего душ: <b id="soul-total">0</b>)</p>
          <button id="prestige-btn">Восстать!</button>
        </div>
      </section>

      <div id="demons"></div>
    </main>

    <section id="shop" hidden>
      <h2>Магазин</h2>
      <div id="shop-list"></div>
    </section>

    <section id="achievements" hidden>
      <h2>Достижения</h2>
      <div id="ach-list"></div>
    </section>

    <nav id="tabs">
      <button class="tab active" data-tab="battle">⚔️ Бой</button>
      <button class="tab" data-tab="shop">🛒 Магазин</button>
      <button class="tab" data-tab="achievements">🏆 Награды</button>
    </nav>
  </div>

  <div id="toast"></div>
  <script src="game.js"></script>
</body>
</html>
